<style>
  #fm-wrap * { box-sizing: border-box; margin: 0; padding: 0; }

  #fm-wrap {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1a0533 0%, #2d0a5c 50%, #1a0533 100%);
    display: flex; flex-direction: column; align-items: center;
    padding: 12px; color: #fff; min-height: 600px; width: 100%;
  }

  #fm-header {
    width: 100%; max-width: 520px; display: flex;
    justify-content: space-between; align-items: center;
    padding: 8px 14px; background: rgba(255,255,255,0.1);
    border-radius: 14px; margin-bottom: 6px;
    border: 1px solid rgba(255,255,255,0.2);
  }

  .fm-stat { text-align: center; }
  .fm-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.7; display: block; }
  .fm-value { font-size: 20px; font-weight: bold; color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.5); display: block; }

  #fm-timer { font-size: 20px; font-weight: bold; color: #ffffff; display: block; }
  #fm-timer.urgent { color: #ff4444; animation: fm-pulse 1s infinite; }
  @keyframes fm-pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  #fm-moves-val { font-size: 20px; font-weight: bold; display: block; }
  #fm-moves-val.low { color: #ff4444; }

  #fm-progress {
    width: 100%; max-width: 520px; display: flex;
    gap: 6px; margin-bottom: 8px;
  }

  .fm-round-pip {
    flex: 1; height: 6px; border-radius: 3px;
    background: rgba(255,255,255,0.15);
    transition: background 0.4s;
  }
  .fm-round-pip.active  { background: #ffd700; }
  .fm-round-pip.passed  { background: #2ecc71; }
  .fm-round-pip.failed  { background: #e74c3c; }

  #fm-target-bar {
    width: 100%; max-width: 520px;
    background: rgba(255,255,255,0.08);
    border-radius: 8px; padding: 5px 12px;
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.12);
  }

  #fm-target-label { font-size: 11px; opacity: 0.7; white-space: nowrap; }

  #fm-progress-track {
    flex: 1; height: 10px; background: rgba(255,255,255,0.15);
    border-radius: 5px; overflow: hidden;
  }

  #fm-progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #f39c12, #2ecc71);
    border-radius: 5px; transition: width 0.3s;
  }

  #fm-target-pct { font-size: 12px; color: #ffd700; white-space: nowrap; }

  #fm-board-wrap { position: relative; }

  #fm-board {
    display: grid; gap: 3px; padding: 10px;
    background: rgba(255,255,255,0.06);
    border-radius: 16px; border: 2px solid rgba(255,255,255,0.15);
    box-shadow: 0 0 30px rgba(150,50,255,0.3); user-select: none;
  }

  .fm-cell {
    border-radius: 10px; display: flex; align-items: center;
    justify-content: center; cursor: pointer;
    transition: transform 0.1s, filter 0.1s; position: relative;
    box-shadow: 0 3px 8px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,255,255,0.3);
  }
  .fm-cell:hover { filter: brightness(1.3); transform: scale(1.05); z-index: 10; }
  .fm-cell.fm-selected { transform: scale(1.12); filter: brightness(1.5); box-shadow: 0 0 18px 4px rgba(255,255,100,0.7); z-index: 20; }
  .fm-cell.fm-matched { animation: fm-pop 0.35s ease forwards; }
  @keyframes fm-pop { 0%{transform:scale(1);opacity:1} 50%{transform:scale(1.4);opacity:0.8;filter:brightness(2)} 100%{transform:scale(0);opacity:0} }
  .fm-cell.fm-falling { animation: fm-fall 0.3s ease-in; }
  @keyframes fm-fall { from{transform:translateY(-40px);opacity:0.5} to{transform:translateY(0);opacity:1} }
  .fm-cell.fm-shake { animation: fm-shake 0.3s ease; }
  @keyframes fm-shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

  .fm-g0{background:linear-gradient(135deg,#e74c3c,#a93226)}
  .fm-g1{background:linear-gradient(135deg,#f7dc6f,#d4ac0d)}
  .fm-g2{background:linear-gradient(135deg,#8e44ad,#6c3483)}
  .fm-g3{background:linear-gradient(135deg,#e67e22,#ca6f1e)}
  .fm-g4{background:linear-gradient(135deg,#e91e8c,#b5006e)}
  .fm-g5{background:linear-gradient(135deg,#3498db,#1a6fa8)}

  #fm-hint { font-size: 12px; opacity: 0.55; margin-top: 8px; text-align: center; color: #fff; }

  /* overlay */
  #fm-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.8); z-index: 999;
    align-items: center; justify-content: center;
  }
  #fm-overlay.show { display: flex; }

  #fm-overlay-box {
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 20px; padding: 28px 32px;
    text-align: center; max-width: 340px; width: 92%; color: #fff;
  }
  #fm-overlay-box.pass-box { background: linear-gradient(135deg,#0a3d1f,#1a6b38); border-color: #2ecc71; }
  #fm-overlay-box.fail-box { background: linear-gradient(135deg,#3d0a0a,#6b1a1a); border-color: #e74c3c; }
  #fm-overlay-box.end-box  { background: linear-gradient(135deg,#2d0a5c,#4a0e8f); border-color: rgba(255,255,255,0.25); }

  #fm-overlay-box h2 { font-size: 28px; margin-bottom: 8px; }
  #fm-overlay-box p  { font-size: 14px; margin-bottom: 5px; opacity: 0.9; }
  #fm-final { font-size: 42px; font-weight: bold; color: #ffd700; margin: 8px 0; }

  .fm-round-results { display: flex; justify-content: center; gap: 6px; margin: 10px 0; flex-wrap: wrap; }
  .fm-rr-pip {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: bold;
  }
  .fm-rr-pip.p { background: #2ecc71; }
  .fm-rr-pip.f { background: #e74c3c; }
  .fm-rr-pip.n { background: rgba(255,255,255,0.2); }

  #fm-btn {
    margin-top: 16px; padding: 10px 26px;
    background: linear-gradient(135deg,#9b59b6,#6c3483);
    border: none; border-radius: 30px; color: #fff;
    font-size: 15px; font-weight: bold; cursor: pointer;
    box-shadow: 0 4px 14px rgba(150,50,255,0.5);
  }
  #fm-btn:hover { filter: brightness(1.2); }

  @keyframes fm-float {
    from{opacity:1;transform:translateY(0) translateX(-50%)}
    to{opacity:0;transform:translateY(-50px) translateX(-50%)}
  }
</style>

<div id="fm-wrap">
  <div id="fm-header">
    <div class="fm-stat">
      <span class="fm-label">Round</span>
      <span class="fm-value" id="fm-round">1 / 5</span>
    </div>
    <div class="fm-stat">
      <span class="fm-label">Score</span>
      <span class="fm-value" id="fm-score">0</span>
    </div>
    <div class="fm-stat">
      <span class="fm-label">Time</span>
      <span id="fm-timer">02:00</span>
    </div>
    <div class="fm-stat">
      <span class="fm-label">Moves Left</span>
      <span id="fm-moves-val" class="fm-value">20</span>
    </div>
  </div>

  <div id="fm-progress">
    <div class="fm-round-pip active" id="fm-pip-0"></div>
    <div class="fm-round-pip" id="fm-pip-1"></div>
    <div class="fm-round-pip" id="fm-pip-2"></div>
    <div class="fm-round-pip" id="fm-pip-3"></div>
    <div class="fm-round-pip" id="fm-pip-4"></div>
  </div>

  <div id="fm-target-bar">
    <span id="fm-target-label">Target: 100 pts</span>
    <div id="fm-progress-track"><div id="fm-progress-fill"></div></div>
    <span id="fm-target-pct">0%</span>
  </div>

  <div id="fm-board-wrap">
    <div id="fm-board"></div>
  </div>
  <div id="fm-hint">Tap a fruit, then tap a neighbouring fruit to swap</div>
</div>

<div id="fm-overlay">
  <div id="fm-overlay-box" class="end-box">
    <h2 id="fm-ot"></h2>
    <p id="fm-om"></p>
    <div id="fm-final"></div>
    <div class="fm-round-results" id="fm-rr"></div>
    <p id="fm-os"></p>
    <button id="fm-btn" onclick="fmNext()">Continue</button>
  </div>
</div>

<script>
(function(){
  var ROUND_DURATION = 2 * 60;
  var ROUNDS = [
    { target:2000, maxMoves:20 },
    { target:2000, maxMoves:20 },
    { target:2000, maxMoves:20 },
    { target:2000, maxMoves:20 },
    { target:2000, maxMoves:20 }
  ];
  var cfg = { cols:8, rows:8, types:6, size:50, pts:15, combo:2.0 };
  var FRUITS = ['&#x1F34E;','&#x1F34B;','&#x1F347;','&#x1F34A;','&#x1F353;','&#x1FAD0;'];

  var returnUrl = 'https://research.sc/participant/login/dynamic/D28AF31C-06D0-47B9-A312-147FD6873247';

  var roundIdx=0, roundScore=0, movesLeft=0, timeLeft=0, roundGen=0;
  var totalScore=0, results=[];
  var grid=[], sel=null, timer=null, busy=false, combo=0;

  var board    = document.getElementById('fm-board');
  var scoreEl  = document.getElementById('fm-score');
  var timerEl  = document.getElementById('fm-timer');
  var movesEl  = document.getElementById('fm-moves-val');
  var roundEl  = document.getElementById('fm-round');
  var overlay  = document.getElementById('fm-overlay');
  var overlayBox = document.querySelector('#fm-overlay-box');
  var fillEl   = document.getElementById('fm-progress-fill');
  var pctEl    = document.getElementById('fm-target-pct');
  var targetLbl= document.getElementById('fm-target-label');

  function startRound() {
    roundGen++;
    var r = ROUNDS[roundIdx];
    roundScore = 0; movesLeft = r.maxMoves; timeLeft = ROUND_DURATION; combo = 0; sel = null;
    busy = false;
    buildBoard();
    hud(); updatePips(); updateTargetBar();
    overlay.classList.remove('show');
    clearInterval(timer);
    timer = setInterval(function(){ timeLeft--; hud(); if(timeLeft<=0) endRound('time'); }, 1000);
  }

  function buildBoard() {
    board.style.gridTemplateColumns = 'repeat('+cfg.cols+','+cfg.size+'px)';
    board.style.gridTemplateRows    = 'repeat('+cfg.rows+','+cfg.size+'px)';
    var ok=false;
    while(!ok){
      grid=[];
      for(var r=0;r<cfg.rows;r++){grid[r]=[];for(var c=0;c<cfg.cols;c++)grid[r][c]=rndGem(r,c);}
      ok=matches().length===0&&hasMoves();
    }
    render();
  }

  function rndGem(r,c){
    var g;
    do{g=Math.floor(Math.random()*cfg.types);}
    while((c>=2&&grid[r][c-1]===g&&grid[r][c-2]===g)||(r>=2&&grid[r-1]&&grid[r-1][c]===g&&grid[r-2]&&grid[r-2][c]===g));
    return g;
  }

  function render(){
    board.innerHTML='';
    for(var r=0;r<cfg.rows;r++) for(var c=0;c<cfg.cols;c++){
      var el=document.createElement('div');
      el.className='fm-cell fm-g'+grid[r][c];
      el.style.width=cfg.size+'px'; el.style.height=cfg.size+'px';
      el.style.fontSize=Math.floor(cfg.size*0.5)+'px';
      el.dataset.r=r; el.dataset.c=c; el.innerHTML=FRUITS[grid[r][c]];
      el.onclick=(function(rr,cc){return function(){click(rr,cc);};})(r,c);
      board.appendChild(el);
    }
  }

  function cell(r,c){ return board.querySelector('[data-r="'+r+'"][data-c="'+c+'"]'); }

  function hud(){
    var r=ROUNDS[roundIdx];
    scoreEl.textContent=roundScore.toLocaleString();
    movesEl.textContent=movesLeft;
    movesEl.className = movesLeft<=5 ? 'fm-value low' : 'fm-value';
    roundEl.textContent=(roundIdx+1)+' / 5';
    var m=Math.floor(timeLeft/60), s=timeLeft%60;
    timerEl.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
    timerEl.className = timeLeft<=30 ? 'urgent' : '';
    updateTargetBar();
  }

  function updateTargetBar(){
    var target=ROUNDS[roundIdx].target;
    var pct=Math.min(100,Math.round(roundScore/target*100));
    fillEl.style.width=pct+'%';
    pctEl.textContent=pct+'%';
    targetLbl.textContent='Target: '+target+' pts';
  }

  function updatePips(){
    for(var i=0;i<5;i++){
      var pip=document.getElementById('fm-pip-'+i);
      pip.className='fm-round-pip';
      if(i<results.length) pip.classList.add(results[i]?'passed':'failed');
      else if(i===roundIdx) pip.classList.add('active');
    }
  }

  function endRound(reason){
    clearInterval(timer); busy=true;
    var passed = roundScore >= ROUNDS[roundIdx].target;
    results.push(passed);
    totalScore += roundScore;
    updatePips();

    var box = document.getElementById('fm-overlay-box');
    box.className = passed ? 'pass-box' : 'fail-box';

    document.getElementById('fm-ot').textContent  = passed ? '✅ Round '+(roundIdx+1)+' Passed!' : '❌ Round '+(roundIdx+1)+' Failed';
    document.getElementById('fm-om').textContent  = passed ? 'You hit the target!' : 'Target: '+ROUNDS[roundIdx].target+' pts — You scored: '+roundScore;
    document.getElementById('fm-final').textContent = roundScore.toLocaleString()+' pts';
    document.getElementById('fm-rr').innerHTML    = '';
    document.getElementById('fm-os').textContent  = roundIdx<4 ? 'Next round starts in 4 seconds…' : '';

    var rrDiv=document.getElementById('fm-rr');
    for(var i=0;i<5;i++){
      var pip=document.createElement('div');
      pip.className='fm-rr-pip '+(i<results.length?(results[i]?'p':'f'):'n');
      pip.textContent=i+1;
      rrDiv.appendChild(pip);
    }

    if(roundIdx<4){
      document.getElementById('fm-btn').textContent='Next Round';
      document.getElementById('fm-btn').style.display='inline-block';
      overlay.classList.add('show');
      setTimeout(function(){ fmNext(); }, 4000);
    } else {
      showFinal();
    }
  }

  function showFinal(){
    var box = document.getElementById('fm-overlay-box');
    box.className='end-box';
    var passed=results.filter(function(r){return r;}).length;
    document.getElementById('fm-ot').textContent = '🏁 Game Over!';
    document.getElementById('fm-om').textContent = 'Total Score:';
    document.getElementById('fm-final').textContent = totalScore.toLocaleString()+' pts';
    document.getElementById('fm-os').textContent = passed+' / 5 rounds passed';
    var rrDiv=document.getElementById('fm-rr');
    rrDiv.innerHTML='';
    for(var i=0;i<5;i++){
      var pip=document.createElement('div');
      pip.className='fm-rr-pip '+(results[i]?'p':'f');
      pip.textContent=i+1;
      rrDiv.appendChild(pip);
    }
    var btn=document.getElementById('fm-btn');
    if(returnUrl){
      btn.textContent='Returning to study…';
      overlay.classList.add('show');
      setTimeout(function(){ window.location.href=returnUrl; }, 4000);
    } else {
      btn.textContent='Play Again';
      overlay.classList.add('show');
    }
  }

  window.fmNext=function(){
    if(roundIdx>=4){
      if(returnUrl) window.location.href=returnUrl;
      else { roundIdx=0; totalScore=0; results=[]; startRound(); }
      return;
    }
    roundIdx++;
    startRound();
  };

  function click(r,c){
    if(busy||movesLeft<=0) return;
    if(sel===null){ sel={r:r,c:c}; var el=cell(r,c); if(el) el.classList.add('fm-selected'); }
    else{
      var prev=sel; var pel=cell(prev.r,prev.c); if(pel) pel.classList.remove('fm-selected');
      sel=null;
      if(prev.r===r&&prev.c===c) return;
      if(Math.abs(prev.r-r)+Math.abs(prev.c-c)===1) swap(prev.r,prev.c,r,c);
      else{ sel={r:r,c:c}; var nel=cell(r,c); if(nel) nel.classList.add('fm-selected'); }
    }
  }

  function swapGrid(r1,c1,r2,c2){ var t=grid[r1][c1]; grid[r1][c1]=grid[r2][c2]; grid[r2][c2]=t; }

  async function swap(r1,c1,r2,c2){
    busy=true; swapGrid(r1,c1,r2,c2); render();
    if(matches().length===0){
      await wait(200); swapGrid(r1,c1,r2,c2); render();
      var a=cell(r1,c1),b=cell(r2,c2);
      if(a){a.classList.add('fm-shake');setTimeout(function(){a.classList.remove('fm-shake');},300);}
      if(b){b.classList.add('fm-shake');setTimeout(function(){b.classList.remove('fm-shake');},300);}
      await wait(300);
    } else {
      movesLeft--; combo=0;
      var genBefore=roundGen;
      await resolve();
      if(roundGen!==genBefore) return;
    }
    busy=false; hud();
    if(!hasMoves()) shuffle();
  }

  function matches(){
    var s=new Set();
    for(var r=0;r<cfg.rows;r++) for(var c=0;c<cfg.cols-2;c++){
      var g=grid[r][c];
      if(g!==null&&g===grid[r][c+1]&&g===grid[r][c+2]){var l=3;while(c+l<cfg.cols&&grid[r][c+l]===g)l++;for(var i=0;i<l;i++)s.add(r+','+(c+i));}
    }
    for(var c=0;c<cfg.cols;c++) for(var r=0;r<cfg.rows-2;r++){
      var g=grid[r][c];
      if(g!==null&&g===grid[r+1][c]&&g===grid[r+2][c]){var l=3;while(r+l<cfg.rows&&grid[r+l][c]===g)l++;for(var i=0;i<l;i++)s.add((r+i)+','+c);}
    }
    return Array.from(s).map(function(k){var p=k.split(',');return{r:+p[0],c:+p[1]};});
  }

  async function resolve(){
    var gen=roundGen;
    var m=matches();
    while(m.length>0){
      if(roundGen!==gen) return;
      combo++;
      var mult=combo>1?(cfg.combo*(combo-1)+1):1;
      var pts=Math.round(m.length*cfg.pts*mult);
      roundScore+=pts;
      m.forEach(function(p){var el=cell(p.r,p.c);if(el)el.classList.add('fm-matched');grid[p.r][p.c]=null;});
      popup(m,pts,combo);
      await wait(380); drop(); fill(); render();
      board.querySelectorAll('.fm-cell').forEach(function(e){e.classList.add('fm-falling');});
      await wait(320); hud(); m=matches();
    }
  }

  function drop(){
    for(var c=0;c<cfg.cols;c++){
      var e=cfg.rows-1;
      for(var r=cfg.rows-1;r>=0;r--) if(grid[r][c]!==null){grid[e][c]=grid[r][c];if(e!==r)grid[r][c]=null;e--;}
      while(e>=0){grid[e][c]=null;e--;}
    }
  }

  function fill(){
    for(var r=0;r<cfg.rows;r++) for(var c=0;c<cfg.cols;c++)
      if(grid[r][c]===null) grid[r][c]=Math.floor(Math.random()*cfg.types);
  }

  function popup(m,pts,combo){
    var ar=m.reduce(function(s,p){return s+p.r;},0)/m.length;
    var ac=m.reduce(function(s,p){return s+p.c;},0)/m.length;
    var d=document.createElement('div');
    d.innerHTML=combo>1?'x'+combo+' +'+pts:'+'+pts;
    d.style.cssText='position:absolute;pointer-events:none;font-weight:bold;z-index:50;animation:fm-float 0.9s ease forwards;'+
      'left:'+(10+ac*(cfg.size+3)+cfg.size/2)+'px;top:'+(10+ar*(cfg.size+3))+'px;'+
      'font-size:'+(combo>1?22:17)+'px;color:'+(combo>1?'#ff6':'#ffd700')+';text-shadow:0 0 8px rgba(0,0,0,0.8);';
    document.getElementById('fm-board-wrap').appendChild(d);
    setTimeout(function(){d.remove();},900);
  }

  function hasMoves(){
    for(var r=0;r<cfg.rows;r++) for(var c=0;c<cfg.cols;c++){
      if(c+1<cfg.cols){swapGrid(r,c,r,c+1);var ok=matches().length>0;swapGrid(r,c,r,c+1);if(ok)return true;}
      if(r+1<cfg.rows){swapGrid(r,c,r+1,c);var ok=matches().length>0;swapGrid(r,c,r+1,c);if(ok)return true;}
    }
    return false;
  }

  function shuffle(){
    busy=true; var n=0;
    do{for(var r=0;r<cfg.rows;r++) for(var c=0;c<cfg.cols;c++) grid[r][c]=Math.floor(Math.random()*cfg.types);n++;}
    while((matches().length>0||!hasMoves())&&n<200);
    render(); busy=false;
  }

  function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}

  startRound();
})();
</script>
