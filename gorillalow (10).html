<style>
  #fm-wrap * { box-sizing: border-box; margin: 0; padding: 0; }

  #fm-wrap {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1a0533 0%, #2d0a5c 50%, #1a0533 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px;
    color: #fff;
    min-height: 600px;
    width: 100%;
  }

  #fm-header {
    width: 100%;
    max-width: 460px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 14px;
    background: rgba(255,255,255,0.1);
    border-radius: 14px;
    margin-bottom: 12px;
    border: 1px solid rgba(255,255,255,0.2);
  }

  .fm-stat { text-align: center; }

  .fm-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.7;
    display: block;
  }

  .fm-value {
    font-size: 22px;
    font-weight: bold;
    color: #ffd700;
    text-shadow: 0 0 10px rgba(255,215,0,0.5);
    display: block;
  }

  #fm-timer {
    font-size: 22px;
    font-weight: bold;
    color: #ffffff;
    display: block;
  }

  #fm-timer.urgent {
    color: #ff4444;
    animation: fm-pulse 1s infinite;
  }

  @keyframes fm-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  #fm-board-wrap { position: relative; }

  #fm-board {
    display: grid;
    gap: 3px;
    padding: 10px;
    background: rgba(255,255,255,0.06);
    border-radius: 16px;
    border: 2px solid rgba(255,255,255,0.15);
    box-shadow: 0 0 30px rgba(150,50,255,0.3);
    user-select: none;
  }

  .fm-cell {
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.1s, filter 0.1s;
    position: relative;
    box-shadow: 0 3px 8px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,255,255,0.3);
  }

  .fm-cell:hover { filter: brightness(1.3); transform: scale(1.05); z-index: 10; }

  .fm-cell.fm-selected {
    transform: scale(1.12);
    filter: brightness(1.5);
    box-shadow: 0 0 18px 4px rgba(255,255,100,0.7);
    z-index: 20;
  }

  .fm-cell.fm-matched { animation: fm-pop 0.35s ease forwards; }

  @keyframes fm-pop {
    0%   { transform: scale(1);   opacity: 1; }
    50%  { transform: scale(1.4); opacity: 0.8; filter: brightness(2); }
    100% { transform: scale(0);   opacity: 0; }
  }

  .fm-cell.fm-falling { animation: fm-fall 0.3s ease-in; }

  @keyframes fm-fall {
    from { transform: translateY(-40px); opacity: 0.5; }
    to   { transform: translateY(0);     opacity: 1; }
  }

  .fm-cell.fm-shake { animation: fm-shake 0.3s ease; }

  @keyframes fm-shake {
    0%, 100% { transform: translateX(0); }
    25%      { transform: translateX(-6px); }
    75%      { transform: translateX(6px); }
  }

  .fm-g0 { background: linear-gradient(135deg, #e74c3c, #a93226); }
  .fm-g1 { background: linear-gradient(135deg, #f7dc6f, #d4ac0d); }
  .fm-g2 { background: linear-gradient(135deg, #8e44ad, #6c3483); }
  .fm-g3 { background: linear-gradient(135deg, #e67e22, #ca6f1e); }
  .fm-g4 { background: linear-gradient(135deg, #e91e8c, #b5006e); }
  .fm-g5 { background: linear-gradient(135deg, #3498db, #1a6fa8); }

  #fm-hint {
    font-size: 12px;
    opacity: 0.55;
    margin-top: 8px;
    text-align: center;
    color: #fff;
  }

  #fm-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 999;
    align-items: center;
    justify-content: center;
  }

  #fm-overlay.show { display: flex; }

  #fm-overlay-box {
    background: linear-gradient(135deg, #2d0a5c, #4a0e8f);
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 20px;
    padding: 32px 36px;
    text-align: center;
    max-width: 320px;
    width: 90%;
    color: #fff;
  }

  #fm-overlay-box h2 {
    font-size: 26px;
    color: #ffd700;
    margin-bottom: 10px;
  }

  #fm-overlay-box p { font-size: 15px; margin-bottom: 6px; opacity: 0.9; }

  #fm-final {
    font-size: 44px;
    font-weight: bold;
    color: #ffd700;
    margin: 10px 0;
  }

  #fm-btn {
    margin-top: 18px;
    padding: 11px 28px;
    background: linear-gradient(135deg, #9b59b6, #6c3483);
    border: none;
    border-radius: 30px;
    color: #fff;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(150,50,255,0.5);
  }

  #fm-btn:hover { filter: brightness(1.2); }

  @keyframes fm-float {
    from { opacity: 1; transform: translateY(0) translateX(-50%); }
    to   { opacity: 0; transform: translateY(-50px) translateX(-50%); }
  }
</style>

<div id="fm-wrap">
  <div id="fm-header">
    <div class="fm-stat">
      <span class="fm-label">Score</span>
      <span class="fm-value" id="fm-score">0</span>
    </div>
    <div class="fm-stat">
      <span class="fm-label">Time Left</span>
      <span id="fm-timer">10:00</span>
    </div>
    <div class="fm-stat">
      <span class="fm-label">Moves</span>
      <span class="fm-value" id="fm-moves">0</span>
    </div>
  </div>

  <div id="fm-board-wrap">
    <div id="fm-board"></div>
  </div>
  <div id="fm-hint">Tap a fruit, then tap a neighbouring fruit to swap</div>
</div>

<div id="fm-overlay">
  <div id="fm-overlay-box">
    <h2 id="fm-ot">&#9200; Time's Up!</h2>
    <p id="fm-om">Final Score:</p>
    <div id="fm-final">0</div>
    <p id="fm-os"></p>
  </div>
</div>

<script>
(function() {
  var DURATION = 10 * 60;
  var cfg = { cols:6, rows:6, types:5, size:62, pts:10, combo:1.5, label:'Low Challenge' };
  var FRUITS = ['&#x1F34E;','&#x1F34B;','&#x1F347;','&#x1F34A;','&#x1F353;','&#x1FAD0;'];

  var returnUrl = '';
  var grid=[], sel=null, score=0, moves=0, timeLeft=DURATION, timer=null, busy=false, combo=0;

  var board  = document.getElementById('fm-board');
  var scoreEl= document.getElementById('fm-score');
  var timerEl= document.getElementById('fm-timer');
  var movesEl= document.getElementById('fm-moves');
  var overlay= document.getElementById('fm-overlay');

  function init() {
    board.style.gridTemplateColumns = 'repeat('+cfg.cols+','+cfg.size+'px)';
    board.style.gridTemplateRows    = 'repeat('+cfg.rows+','+cfg.size+'px)';
    var ok = false;
    while (!ok) {
      grid = [];
      for (var r=0;r<cfg.rows;r++) { grid[r]=[]; for (var c=0;c<cfg.cols;c++) grid[r][c]=rndGem(r,c); }
      ok = matches().length===0 && hasMoves();
    }
    score=0; moves=0; timeLeft=DURATION; combo=0; sel=null;
    hud(); render(); startTimer();
  }

  function rndGem(r,c) {
    var g;
    do { g=Math.floor(Math.random()*cfg.types); }
    while ((c>=2&&grid[r][c-1]===g&&grid[r][c-2]===g)||(r>=2&&grid[r-1]&&grid[r-1][c]===g&&grid[r-2]&&grid[r-2][c]===g));
    return g;
  }

  function render() {
    board.innerHTML='';
    for (var r=0;r<cfg.rows;r++) {
      for (var c=0;c<cfg.cols;c++) {
        var el=document.createElement('div');
        el.className='fm-cell fm-g'+grid[r][c];
        el.style.width=cfg.size+'px'; el.style.height=cfg.size+'px';
        el.style.fontSize=Math.floor(cfg.size*0.5)+'px';
        el.dataset.r=r; el.dataset.c=c;
        el.innerHTML=FRUITS[grid[r][c]];
        el.onclick=(function(rr,cc){return function(){click(rr,cc);};})(r,c);
        board.appendChild(el);
      }
    }
  }

  function cell(r,c){ return board.querySelector('[data-r="'+r+'"][data-c="'+c+'"]'); }

  function hud() {
    scoreEl.textContent=score.toLocaleString();
    movesEl.textContent=moves;
    var m=Math.floor(timeLeft/60), s=timeLeft%60;
    timerEl.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
    timerEl.className = timeLeft<=60 ? 'urgent' : '';
  }

  function startTimer() {
    clearInterval(timer);
    timer=setInterval(function(){ timeLeft--; hud(); if(timeLeft<=0) end(); },1000);
  }

  function end() {
    clearInterval(timer); busy=true;
    document.getElementById('fm-om').textContent=cfg.label+' — Final Score:';
    document.getElementById('fm-final').textContent=score.toLocaleString();
    document.getElementById('fm-os').textContent='You made '+moves+' moves. Great job!';
    overlay.classList.add('show');
  }

  window.fmRestart=function(){
    if (returnUrl) { window.location.href = returnUrl; return; }
    overlay.classList.remove('show'); busy=false; init();
  };

  function click(r,c) {
    if (busy) return;
    if (sel===null) { sel={r:r,c:c}; var el=cell(r,c); if(el) el.classList.add('fm-selected'); }
    else {
      var prev=sel; var pel=cell(prev.r,prev.c); if(pel) pel.classList.remove('fm-selected');
      sel=null;
      if (prev.r===r&&prev.c===c) return;
      if (Math.abs(prev.r-r)+Math.abs(prev.c-c)===1) { swap(prev.r,prev.c,r,c,true); }
      else { sel={r:r,c:c}; var nel=cell(r,c); if(nel) nel.classList.add('fm-selected'); }
    }
  }

  function swapGrid(r1,c1,r2,c2){ var t=grid[r1][c1]; grid[r1][c1]=grid[r2][c2]; grid[r2][c2]=t; }

  async function swap(r1,c1,r2,c2) {
    busy=true; swapGrid(r1,c1,r2,c2); render();
    if (matches().length===0) {
      await wait(200); swapGrid(r1,c1,r2,c2); render();
      var a=cell(r1,c1),b=cell(r2,c2);
      if(a){a.classList.add('fm-shake');setTimeout(function(){a.classList.remove('fm-shake');},300);}
      if(b){b.classList.add('fm-shake');setTimeout(function(){b.classList.remove('fm-shake');},300);}
      await wait(300);
    } else { moves++; combo=0; await resolve(); }
    busy=false; hud(); if(!hasMoves()) shuffle();
  }

  function matches() {
    var s=new Set();
    for(var r=0;r<cfg.rows;r++) for(var c=0;c<cfg.cols-2;c++) {
      var g=grid[r][c];
      if(g!==null&&g===grid[r][c+1]&&g===grid[r][c+2]){var l=3;while(c+l<cfg.cols&&grid[r][c+l]===g)l++;for(var i=0;i<l;i++)s.add(r+',+'+(c+i));}
    }
    for(var c=0;c<cfg.cols;c++) for(var r=0;r<cfg.rows-2;r++) {
      var g=grid[r][c];
      if(g!==null&&g===grid[r+1][c]&&g===grid[r+2][c]){var l=3;while(r+l<cfg.rows&&grid[r+l][c]===g)l++;for(var i=0;i<l;i++)s.add((r+i)+','+c);}
    }
    return Array.from(s).map(function(k){var p=k.split(',');return{r:+p[0],c:+p[1]};});
  }

  async function resolve() {
    var m=matches();
    while(m.length>0){
      combo++;
      var mult=combo>1?(cfg.combo*(combo-1)+1):1;
      var pts=Math.round(m.length*cfg.pts*mult);
      score+=pts;
      m.forEach(function(p){var el=cell(p.r,p.c);if(el)el.classList.add('fm-matched');grid[p.r][p.c]=null;});
      popup(m,pts,combo);
      await wait(380);
      drop(); fill(); render();
      board.querySelectorAll('.fm-cell').forEach(function(e){e.classList.add('fm-falling');});
      await wait(320); hud(); m=matches();
    }
  }

  function drop() {
    for(var c=0;c<cfg.cols;c++){
      var e=cfg.rows-1;
      for(var r=cfg.rows-1;r>=0;r--) if(grid[r][c]!==null){grid[e][c]=grid[r][c];if(e!==r)grid[r][c]=null;e--;}
      while(e>=0){grid[e][c]=null;e--;}
    }
  }

  function fill() {
    for(var r=0;r<cfg.rows;r++) for(var c=0;c<cfg.cols;c++)
      if(grid[r][c]===null) grid[r][c]=Math.floor(Math.random()*cfg.types);
  }

  function popup(m,pts,combo) {
    var ar=m.reduce(function(s,p){return s+p.r;},0)/m.length;
    var ac=m.reduce(function(s,p){return s+p.c;},0)/m.length;
    var d=document.createElement('div');
    d.innerHTML=combo>1?'x'+combo+' +'+pts:'+'+pts;
    d.style.cssText='position:absolute;pointer-events:none;font-weight:bold;z-index:50;'+
      'animation:fm-float 0.9s ease forwards;'+
      'left:'+(10+ac*(cfg.size+3)+cfg.size/2)+'px;'+
      'top:'+(10+ar*(cfg.size+3))+'px;'+
      'font-size:'+(combo>1?22:17)+'px;'+
      'color:'+(combo>1?'#ff6':'#ffd700')+';'+
      'text-shadow:0 0 8px rgba(0,0,0,0.8);';
    document.getElementById('fm-board-wrap').appendChild(d);
    setTimeout(function(){d.remove();},900);
  }

  function hasMoves() {
    for(var r=0;r<cfg.rows;r++) for(var c=0;c<cfg.cols;c++){
      if(c+1<cfg.cols){swapGrid(r,c,r,c+1);var ok=matches().length>0;swapGrid(r,c,r,c+1);if(ok)return true;}
      if(r+1<cfg.rows){swapGrid(r,c,r+1,c);var ok=matches().length>0;swapGrid(r,c,r+1,c);if(ok)return true;}
    }
    return false;
  }

  function shuffle() {
    busy=true; var n=0;
    do{ for(var r=0;r<cfg.rows;r++) for(var c=0;c<cfg.cols;c++) grid[r][c]=Math.floor(Math.random()*cfg.types); n++; }
    while((matches().length>0||!hasMoves())&&n<200);
    render(); busy=false;
  }

  function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}

  init();
})();
</script>
