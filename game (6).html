<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Match</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1a0533 0%, #2d0a5c 50%, #1a0533 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 10px;
    color: #fff;
    overflow-x: hidden;
  }

  #header {
    width: 100%;
    max-width: 500px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: rgba(255,255,255,0.08);
    border-radius: 14px;
    margin-bottom: 10px;
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.15);
  }

  .stat-box {
    text-align: center;
  }

  .stat-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.7;
  }

  .stat-value {
    font-size: 22px;
    font-weight: bold;
    color: #ffd700;
    text-shadow: 0 0 10px rgba(255,215,0,0.5);
  }

  #timer-value {
    color: #fff;
  }

  #timer-value.urgent {
    color: #ff4444;
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  #board-container {
    position: relative;
  }

  #board {
    display: grid;
    gap: 3px;
    padding: 10px;
    background: rgba(255,255,255,0.06);
    border-radius: 16px;
    border: 2px solid rgba(255,255,255,0.15);
    box-shadow: 0 0 30px rgba(150, 50, 255, 0.3);
    user-select: none;
  }

  .cell {
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.1s ease, filter 0.1s ease;
    position: relative;
    font-size: 28px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,255,255,0.3);
  }

  .cell:hover {
    filter: brightness(1.3);
    transform: scale(1.05);
    z-index: 10;
  }

  .cell.selected {
    transform: scale(1.12);
    filter: brightness(1.5);
    box-shadow: 0 0 18px 4px rgba(255,255,100,0.7), 0 3px 8px rgba(0,0,0,0.4);
    z-index: 20;
  }

  .cell.matched {
    animation: matchPop 0.35s ease forwards;
  }

  @keyframes matchPop {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.4); opacity: 0.8; filter: brightness(2); }
    100% { transform: scale(0); opacity: 0; }
  }

  .cell.falling {
    animation: fall 0.3s ease-in;
  }

  @keyframes fall {
    from { transform: translateY(-40px); opacity: 0.5; }
    to { transform: translateY(0); opacity: 1; }
  }

  .cell.invalid-swap {
    animation: shake 0.3s ease;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  /* Gem colors */
  /* 🍎 red apple */ .gem-0 { background: linear-gradient(135deg, #e74c3c, #a93226); }
  /* 🍋 lemon    */ .gem-1 { background: linear-gradient(135deg, #f7dc6f, #d4ac0d); }
  /* 🍇 grape    */ .gem-2 { background: linear-gradient(135deg, #8e44ad, #6c3483); }
  /* 🍊 orange   */ .gem-3 { background: linear-gradient(135deg, #e67e22, #ca6f1e); }
  /* 🍓 berry    */ .gem-4 { background: linear-gradient(135deg, #e91e8c, #b5006e); }
  /* 🫐 blueberry*/ .gem-5 { background: linear-gradient(135deg, #3498db, #1a6fa8); }

  #overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }

  #overlay.show {
    display: flex;
  }

  #overlay-box {
    background: linear-gradient(135deg, #2d0a5c, #4a0e8f);
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 20px;
    padding: 36px 40px;
    text-align: center;
    max-width: 340px;
    width: 90%;
    box-shadow: 0 0 40px rgba(150,50,255,0.5);
  }

  #overlay-box h2 {
    font-size: 28px;
    margin-bottom: 12px;
    color: #ffd700;
    text-shadow: 0 0 12px rgba(255,215,0,0.5);
  }

  #overlay-box p {
    font-size: 16px;
    margin-bottom: 8px;
    opacity: 0.9;
    line-height: 1.5;
  }

  #final-score {
    font-size: 42px;
    font-weight: bold;
    color: #ffd700;
    margin: 12px 0;
    text-shadow: 0 0 16px rgba(255,215,0,0.6);
  }

  #overlay-btn {
    margin-top: 20px;
    padding: 12px 32px;
    background: linear-gradient(135deg, #9b59b6, #6c3483);
    border: none;
    border-radius: 30px;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 1px;
    transition: transform 0.15s, filter 0.15s;
    box-shadow: 0 4px 14px rgba(150,50,255,0.5);
  }

  #overlay-btn:hover {
    transform: scale(1.06);
    filter: brightness(1.2);
  }

  #score-popup {
    position: absolute;
    pointer-events: none;
    font-size: 18px;
    font-weight: bold;
    color: #ffd700;
    text-shadow: 0 0 8px rgba(0,0,0,0.8);
    z-index: 50;
    animation: floatUp 0.9s ease forwards;
  }

  @keyframes floatUp {
    from { opacity: 1; transform: translateY(0); }
    to { opacity: 0; transform: translateY(-50px); }
  }

  #hint-msg {
    font-size: 12px;
    opacity: 0.6;
    margin-top: 8px;
    text-align: center;
  }
</style>
</head>
<body>

<div id="header">
  <div class="stat-box">
    <div class="stat-label">Score</div>
    <div class="stat-value" id="score-display">0</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">Time Left</div>
    <div class="stat-value" id="timer-value">15:00</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">Moves</div>
    <div class="stat-value" id="moves-display">0</div>
  </div>
</div>

<div id="board-container">
  <div id="board"></div>
</div>
<div id="hint-msg">Tap a fruit, then tap an adjacent fruit to swap</div>

<div id="overlay">
  <div id="overlay-box">
    <h2 id="overlay-title">Game Over!</h2>
    <p id="overlay-msg">Time's up! Here's how you did:</p>
    <div id="final-score">0</div>
    <p id="overlay-sub"></p>
    <button id="overlay-btn" onclick="restartGame()">Play Again</button>
  </div>
</div>

<script>
// ─── Configuration ───────────────────────────────────────────────────────────
const GAME_DURATION = 15 * 60; // 15 minutes in seconds

function getMode() {
  const params = new URLSearchParams(window.location.search);
  const m = (params.get('mode') || '').toLowerCase();
  return m === 'high' ? 'high' : 'low';
}

const MODE = getMode();

const CONFIG = {
  low: {
    cols: 6,
    rows: 6,
    gemTypes: 5,
    cellSize: 62,
    pointsPerGem: 10,
    comboMultiplier: 1.5,
    label: 'Low Challenge'
  },
  high: {
    cols: 8,
    rows: 8,
    gemTypes: 6,
    cellSize: 52,
    pointsPerGem: 15,
    comboMultiplier: 2.0,
    label: 'High Challenge'
  }
};

const cfg = CONFIG[MODE];

// ─── Game State ──────────────────────────────────────────────────────────────
let grid = [];
let selected = null;
let score = 0;
let moves = 0;
let timeLeft = GAME_DURATION;
let timerInterval = null;
let busy = false;
let combo = 0;

const GEMS = ['🍎', '🍋', '🍇', '🍊', '🍓', '🫐'];

// ─── DOM ─────────────────────────────────────────────────────────────────────
const boardEl = document.getElementById('board');
const scoreEl = document.getElementById('score-display');
const timerEl = document.getElementById('timer-value');
const movesEl = document.getElementById('moves-display');
const overlay = document.getElementById('overlay');

// ─── Init ─────────────────────────────────────────────────────────────────────
function initGame() {
  boardEl.style.gridTemplateColumns = `repeat(${cfg.cols}, ${cfg.cellSize}px)`;
  boardEl.style.gridTemplateRows = `repeat(${cfg.rows}, ${cfg.cellSize}px)`;

  do {
    grid = [];
    for (let r = 0; r < cfg.rows; r++) {
      grid[r] = [];
      for (let c = 0; c < cfg.cols; c++) {
        grid[r][c] = randomGem(r, c);
      }
    }
  } while (findMatches().length > 0 || !hasValidMoves());

  score = 0; moves = 0; timeLeft = GAME_DURATION; combo = 0; selected = null;
  updateHUD();
  renderBoard();
  startTimer();
}

function randomGem(r, c) {
  let g;
  do {
    g = Math.floor(Math.random() * cfg.gemTypes);
  } while (
    (c >= 2 && grid[r][c-1] === g && grid[r][c-2] === g) ||
    (r >= 2 && grid[r-1] && grid[r-1][c] === g && grid[r-2] && grid[r-2][c] === g)
  );
  return g;
}

// ─── Rendering ────────────────────────────────────────────────────────────────
function renderBoard() {
  boardEl.innerHTML = '';
  for (let r = 0; r < cfg.rows; r++) {
    for (let c = 0; c < cfg.cols; c++) {
      const cell = document.createElement('div');
      cell.className = `cell gem-${grid[r][c]}`;
      cell.style.width = cfg.cellSize + 'px';
      cell.style.height = cfg.cellSize + 'px';
      cell.dataset.r = r;
      cell.dataset.c = c;
      cell.textContent = GEMS[grid[r][c]];
      cell.style.fontSize = Math.floor(cfg.cellSize * 0.5) + 'px';
      cell.addEventListener('click', () => onCellClick(r, c));
      boardEl.appendChild(cell);
    }
  }
}

function getCell(r, c) {
  return boardEl.querySelector(`[data-r="${r}"][data-c="${c}"]`);
}

function updateHUD() {
  scoreEl.textContent = score.toLocaleString();
  movesEl.textContent = moves;
  const mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
  const secs = (timeLeft % 60).toString().padStart(2, '0');
  timerEl.textContent = `${mins}:${secs}`;
  timerEl.className = timeLeft <= 60 ? 'stat-value urgent' : 'stat-value';
}

// ─── Timer ────────────────────────────────────────────────────────────────────
function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    updateHUD();
    if (timeLeft <= 0) endGame();
  }, 1000);
}

function endGame() {
  clearInterval(timerInterval);
  busy = true;
  document.getElementById('overlay-title').textContent = '⏰ Time\'s Up!';
  document.getElementById('overlay-msg').textContent = `${cfg.label} — Final Score:`;
  document.getElementById('final-score').textContent = score.toLocaleString();
  document.getElementById('overlay-sub').textContent = `You made ${moves} moves. Great job!`;
  overlay.classList.add('show');
}

function restartGame() {
  overlay.classList.remove('show');
  busy = false;
  initGame();
}

// ─── Click / Swap ─────────────────────────────────────────────────────────────
function onCellClick(r, c) {
  if (busy) return;

  if (selected === null) {
    selected = { r, c };
    getCell(r, c).classList.add('selected');
  } else {
    const prev = selected;
    getCell(prev.r, prev.c).classList.remove('selected');
    selected = null;

    if (prev.r === r && prev.c === c) return;

    if (isAdjacent(prev, { r, c })) {
      trySwap(prev.r, prev.c, r, c);
    } else {
      // re-select the new cell
      selected = { r, c };
      getCell(r, c).classList.add('selected');
    }
  }
}

function isAdjacent(a, b) {
  return (Math.abs(a.r - b.r) + Math.abs(a.c - b.c)) === 1;
}

async function trySwap(r1, c1, r2, c2) {
  busy = true;
  swapGems(r1, c1, r2, c2);
  renderBoard();

  const matches = findMatches();
  if (matches.length === 0) {
    // invalid — swap back
    await delay(200);
    swapGems(r1, c1, r2, c2);
    renderBoard();
    animateInvalid(r1, c1);
    animateInvalid(r2, c2);
    await delay(300);
  } else {
    moves++;
    combo = 0;
    await resolveMatches();
  }

  busy = false;
  updateHUD();
  if (!hasValidMoves()) shuffleBoard();
}

function swapGems(r1, c1, r2, c2) {
  [grid[r1][c1], grid[r2][c2]] = [grid[r2][c2], grid[r1][c1]];
}

function animateInvalid(r, c) {
  const cell = getCell(r, c);
  if (cell) {
    cell.classList.add('invalid-swap');
    setTimeout(() => cell.classList.remove('invalid-swap'), 300);
  }
}

// ─── Match Logic ──────────────────────────────────────────────────────────────
function findMatches() {
  const matched = new Set();

  // Horizontal
  for (let r = 0; r < cfg.rows; r++) {
    for (let c = 0; c < cfg.cols - 2; c++) {
      const g = grid[r][c];
      if (g !== null && g === grid[r][c+1] && g === grid[r][c+2]) {
        let len = 3;
        while (c + len < cfg.cols && grid[r][c+len] === g) len++;
        for (let i = 0; i < len; i++) matched.add(`${r},${c+i}`);
      }
    }
  }

  // Vertical
  for (let c = 0; c < cfg.cols; c++) {
    for (let r = 0; r < cfg.rows - 2; r++) {
      const g = grid[r][c];
      if (g !== null && g === grid[r+1][c] && g === grid[r+2][c]) {
        let len = 3;
        while (r + len < cfg.rows && grid[r+len][c] === g) len++;
        for (let i = 0; i < len; i++) matched.add(`${r+i},${c}`);
      }
    }
  }

  return [...matched].map(k => {
    const [r, c] = k.split(',').map(Number);
    return { r, c };
  });
}

async function resolveMatches() {
  let matches = findMatches();
  while (matches.length > 0) {
    combo++;
    const multiplier = combo > 1 ? (cfg.comboMultiplier * (combo - 1) + 1) : 1;
    const pts = Math.round(matches.length * cfg.pointsPerGem * multiplier);
    score += pts;

    // Animate removal
    matches.forEach(({ r, c }) => {
      const cell = getCell(r, c);
      if (cell) cell.classList.add('matched');
      grid[r][c] = null;
    });

    showScorePopup(matches, pts, combo);
    await delay(380);

    // Drop gems
    dropGems();
    fillGems();
    renderBoard();

    // Animate fall
    boardEl.querySelectorAll('.cell').forEach(c => c.classList.add('falling'));
    await delay(320);

    updateHUD();
    matches = findMatches();
  }
}

function dropGems() {
  for (let c = 0; c < cfg.cols; c++) {
    let emptyRow = cfg.rows - 1;
    for (let r = cfg.rows - 1; r >= 0; r--) {
      if (grid[r][c] !== null) {
        grid[emptyRow][c] = grid[r][c];
        if (emptyRow !== r) grid[r][c] = null;
        emptyRow--;
      }
    }
    while (emptyRow >= 0) {
      grid[emptyRow][c] = null;
      emptyRow--;
    }
  }
}

function fillGems() {
  for (let r = 0; r < cfg.rows; r++) {
    for (let c = 0; c < cfg.cols; c++) {
      if (grid[r][c] === null) {
        grid[r][c] = Math.floor(Math.random() * cfg.gemTypes);
      }
    }
  }
}

// ─── Score Popup ──────────────────────────────────────────────────────────────
function showScorePopup(matches, pts, combo) {
  const avgR = matches.reduce((s, m) => s + m.r, 0) / matches.length;
  const avgC = matches.reduce((s, m) => s + m.c, 0) / matches.length;
  const popup = document.createElement('div');
  popup.className = 'score-popup';
  popup.id = 'score-popup';
  popup.textContent = combo > 1 ? `x${combo} +${pts}` : `+${pts}`;
  popup.style.position = 'absolute';
  popup.style.left = (10 + avgC * (cfg.cellSize + 3) + cfg.cellSize / 2) + 'px';
  popup.style.top = (10 + avgR * (cfg.cellSize + 3)) + 'px';
  popup.style.transform = 'translateX(-50%)';
  popup.style.fontSize = combo > 1 ? '22px' : '17px';
  popup.style.color = combo > 1 ? '#ff6' : '#ffd700';
  popup.style.fontWeight = 'bold';
  popup.style.textShadow = '0 0 8px rgba(0,0,0,0.8)';
  popup.style.pointerEvents = 'none';
  popup.style.zIndex = '50';
  popup.style.animation = 'floatUp 0.9s ease forwards';
  document.getElementById('board-container').appendChild(popup);
  setTimeout(() => popup.remove(), 900);
}

// ─── Valid Move Check & Shuffle ───────────────────────────────────────────────
function hasValidMoves() {
  for (let r = 0; r < cfg.rows; r++) {
    for (let c = 0; c < cfg.cols; c++) {
      if (c + 1 < cfg.cols) {
        swapGems(r, c, r, c + 1);
        const m = findMatches().length > 0;
        swapGems(r, c, r, c + 1);
        if (m) return true;
      }
      if (r + 1 < cfg.rows) {
        swapGems(r, c, r + 1, c);
        const m = findMatches().length > 0;
        swapGems(r, c, r + 1, c);
        if (m) return true;
      }
    }
  }
  return false;
}

function shuffleBoard() {
  busy = true;
  let attempts = 0;
  do {
    for (let r = 0; r < cfg.rows; r++)
      for (let c = 0; c < cfg.cols; c++)
        grid[r][c] = Math.floor(Math.random() * cfg.gemTypes);
    attempts++;
  } while ((findMatches().length > 0 || !hasValidMoves()) && attempts < 200);
  renderBoard();
  busy = false;
}

// ─── Helpers ─────────────────────────────────────────────────────────────────
function delay(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

// ─── Start ────────────────────────────────────────────────────────────────────
initGame();
</script>
</body>
</html>
